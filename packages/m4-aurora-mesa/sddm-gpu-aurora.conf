# The Qt greeter's renderer environment (m4-support's gpu-load links it as /etc/sddm.conf.d/zz-m4-gpu.conf while the GPU driver is up).
[General]
GreeterEnvironment=LD_LIBRARY_PATH=/opt/aurora-mesa/lib,GBM_BACKENDS_PATH=/opt/aurora-mesa/lib/gbm,__EGL_VENDOR_LIBRARY_FILENAMES=/opt/aurora-mesa/share/glvnd/egl_vendor.d/50_mesa.json,MESA_GLTHREAD=false,ASAHI_MESA_DEBUG=1queue:nocompress,GDK_BACKEND=wayland,GSK_RENDERER=gl,GDK_DISABLE=vulkan,QT_QPA_PLATFORM=wayland,QT_WAYLAND_CLIENT_BUFFER_INTEGRATION=wayland-egl,QT_WAYLAND_DISABLE_WINDOWDECORATION=1,QSG_RHI_BACKEND=opengl,QSG_RENDER_LOOP=basic,AQ_NO_MODIFIERS=1,MESA_SHADER_CACHE_DISABLE=true,XDG_CURRENT_DESKTOP=Hyprland

[Theme]
ThemeDir=/usr/share/m4/sddm-themes
Current=omarchy-lock
