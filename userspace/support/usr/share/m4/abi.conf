# Boot ABI v1 window limits (bytes). Loader rev 11: Image <= 29,949,952, initramfs <= 16 MiB, board.dtb <= 36,864 (lane L's BOOT-ABI.md).
# board.dtb: m4-boot uses the limit the running loader publishes as /chosen/m4,board-dtb-max (rev 12: 98,304), 36,864 when the
# loader publishes none (rev 11), and 98,304 in a system our loader did not boot (a chroot). A dtb_max line here overrides all.
image_max=29949952
initramfs_max=16777216
