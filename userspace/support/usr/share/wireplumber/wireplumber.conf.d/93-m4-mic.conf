# m4: the built-in microphones as a usable source. The AOP delivers the three raw PDM channels about 50 dB below line level,
# as on every Apple Silicon Mac; asahi-audio lifts them in a per-model filter graph (mixer gains + the triforce beamformer +
# a high-pass) but has no J616 entry, so the raw 3-channel node was the default input and recordings were near silence.
# j616-mic.json is the J316/J516 graph (same 16" chassis; the microphone geometry is taken from it, not measured here) with
# the final gain 10 x 10 x 5.8 instead of 7.6 x 7.6 (+20 dB; PipeWire's builtin mixer caps each Gain at 10). Measured on the
# J616s: speech-band noise from the speakers at full volume -20 dBFS rms, at half volume -38 dBFS, room silence -50 dBFS
# (source volume 70 %). The raw node is hidden; it must not be muted (WirePlumber keeps its mute state per user).
# To go back to the raw microphones: an empty file of the same name under /etc/wireplumber/wireplumber.conf.d.
node.software-dsp.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*"
        alsa.driver_name = "snd_soc_aop"
      }
    ]
    actions = {
      create-filter = {
        filter-path = "/usr/share/m4/microphones/j616-mic.json"
        hide-parent = true
      }
    }
  }
]
