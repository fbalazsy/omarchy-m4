# m4 : name the built-in microphones of the AOP audio card (snd-soc-aop, ALSA driver name "snd_soc_aop").
# Override or empty it with the same name under /etc/wireplumber/wireplumber.conf.d to go back to the default names.
# Cosmetic only: the card works without it (WirePlumber offers it as a 3-channel "Pro Audio" source).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
        device.sysfs.path = "~.*[.]aop/.*"
      }
      {
        node.name = "~alsa_input.*"
        alsa.driver_name = "snd_soc_aop"
      }
    ]
    actions = {
      update-props = {
        device.description = "Built-in Microphones"
        device.nick = "AOP microphones"
        node.description = "Built-in Microphones"
        node.nick = "AOP microphones"
      }
    }
  }
]
