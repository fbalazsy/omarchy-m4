# m4 (gaps G7): the asahi-audio DSP chain on the J616 speakers. asahi-audio's own 99-asahi.conf
# already renames hw:AppleJ616,1 to alsa_output.platform-sound.RawSpeakers (its AppleJ[0-9]{3} rule) and forces the
# raw route volume to 1.0 (asahi-lock-volume.lua); this adds only the filter, which asahi-audio has no J616 entry for.
# The J316 filters are the fallback. This Mac's own EQ (G7 stage 6) is j616-graph-macos.json: its two FIRs are rendered from
# Apple's presets on your own macOS (tools/macos/j616-speaker-fir of the repository), so they are never packaged.
# `sudo m4-speakers install DIR` copies them to /etc/m4/speakers and adds /etc/wireplumber/wireplumber.conf.d/
# 99-zz-m4-speakers-macos.conf, which picks that graph; its name sorts after asahi-audio's 99-asahi.conf, so the override also
# replaces a J616 rule there. `m4-speakers remove` goes back to this file's filters.
node.software-dsp.rules = [
    {
        matches = [
            { api.alsa.path = "hw:AppleJ616,1" }
        ]
        actions = {
            create-filter = {
                filter-path = "/usr/share/m4/speakers/j616-graph.json"
                hide-parent = true
            }
        }
    }
]
