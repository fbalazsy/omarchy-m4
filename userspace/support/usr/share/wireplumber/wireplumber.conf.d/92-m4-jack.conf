# m4 (gaps G3): the J616 headphone jack, a sound card of its own (hw:AppleJack). Inert until the kernel registers that card
# (the jack is off in the default device tree). The UCM (MacBook Pro J616 Jack.conf) ties the Headphones and Headset devices to
# the jack switches: unplugged, the card has no available profile and WirePlumber turns it off. Plugged in, these priorities
# make the jack the default sink and source, above the J616 speaker filter (priority.session 850) and the AOP microphones (2000,
# WirePlumber's default for capture device 0). A default chosen by hand in the desktop still wins while it is available.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        api.alsa.path = "hw:AppleJack,0"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 1100
        priority.session = 1100
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*"
        api.alsa.path = "hw:AppleJack,0"
      }
    ]
    actions = {
      update-props = {
        priority.driver = 2100
        priority.session = 2100
      }
    }
  }
]
