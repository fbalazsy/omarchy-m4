Syntax 6

# m4 (gaps G7): the J616 speaker card. Like asahi's J316 entry, but self-contained: the J616 card
# has no headphone codec (the jack is not wired up), so the laptops/HiFi.conf verb's Headphone Playback Mux would fail.
SectionUseCase."HiFi" {
	Comment "Default"
	File "/conf.d/macaudio/j616/HiFi.conf"
}
