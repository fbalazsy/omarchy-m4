# m4 (gaps G3): the J616 headphone jack (CS42L84 on PCM 0 of the AppleJack card). Like asahi's cs42l84/Headphones.conf,
# but with this kernel's control names (asahi's "Jack ADC Preamp Gain" is "Jack ADC Preamp Capture Volume" here) and
# without the speaker card's mixer. The kernel caps "Jack DAC" at -6 dB; 100 % volume is that cap.

SectionVerb {
	EnableSequence [
		cset "name='Headphone Playback Mux' 'Primary'"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='Headphone Switch' on"
		cset "name='Jack DACA Select' 'ASP RX CH1'"
		cset "name='Jack DACB Select' 'ASP RX CH2'"
	]

	Value {
		PlaybackPriority 300
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		JackControl "Headphone Jack"
		PlaybackMixerElem "Jack DAC"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='Headset Mic Switch' on"
		cset "name='Jack ADC WNF Switch' on"
		cset "name='Jack WNF Corner Frequency' 1"
		cset "name='Jack ADC HPF Switch' on"
		cset "name='Jack HPF Corner Frequency' 1"
		cset "name='Jack ADC Preamp Capture Volume' 2"
		cset "name='Jack SDOUT1 Select' 'ADC'"
	]

	Value {
		CapturePriority 300
		CapturePCM "hw:${CardId},0"
		CaptureChannels 1
		CaptureMixerElem "Jack ADC PGA"
		CaptureMasterElem "Jack ADC Preamp"
		JackControl "Headset Mic Jack"
	}
}
