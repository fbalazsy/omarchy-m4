Syntax 6

# m4 (gaps G3): the J616 headphone jack, a sound card of its own (macaudio "apple,j616-macaudio-jack", id AppleJack),
# apart from the speaker card "MacBook Pro J616". UCM loads this file only for a card of that name, so it stays
# inert while the kernel does not register the jack card (the jack is off in the default device tree).
SectionUseCase."HiFi" {
	Comment "Default"
	File "/conf.d/macaudio/j616/Jack.conf"
}
