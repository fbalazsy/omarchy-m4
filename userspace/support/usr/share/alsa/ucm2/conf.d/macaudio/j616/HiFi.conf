# m4 (gaps G7): the J616 speakers (6 channels on PCM 1: LW1 RW1 LW2 RW2 LT RT)

SectionVerb {
	EnableSequence [
		cset "name='Speaker Playback Mux' 'Secondary'"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='Speaker Switch' on"
	]

	Value {
		PlaybackChannels "6"
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}
