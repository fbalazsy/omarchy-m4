# speakersafetyd profile for J616s (MacBook Pro 16", M4 Pro, Mac16,7), shipped by m4-support (gaps G7).
# Thermal model: this Mac's macOS 26.6.2 tuning AID35 (/product/audio acoustic-id 0x23, builtin_speaker_out_general.austrip +
# aid35-aufx-spp3-appl.plist) through Asahi speakersafetyd's docs/audump.py @615674e7; speaker variant 3 uses the same file.
# The limits are macOS's (t_limit 140 C, t_headroom 10); the attended bring-up ran with 120/5.
# Sections in the ADT provider order (LW1 RW1 LW2 RW2 LT RT); is_chan/vs_chan 2i/2i+1, proven per amp by the stage 3 sense check.
# Never derive a different model from j316.conf: J616 differs.

[Globals]
visense_pcm = 2
t_ambient = 50.0
t_hysteresis = 5.0
t_window = 20.0
channels = 12
period = 4096
link_gains = True
uclamp_max = 64

[Controls]
vsense = VSENSE Switch
isense = ISENSE Switch
amp_gain = Amp Gain Volume
volume = Speaker Volume

