# m4-support: modules that must not autoload by alias are blacklisted here and loaded by name from the m4-*.service units (a blacklist stops
# alias autoload only; `modprobe NAME` loads them). Modules that autoload carry an `install` rule that skips them on a rescue boot (m4.safe on
# the command line). The rules pass no $CMDLINE_OPTS: kmod fills it with the `options` lines too and the inner modprobe reads them again,
# and a Rust module refuses a parameter given twice (snd_soc_aop speakers=1 failed to load on m4.10). So `options` lines apply, and options
# on a modprobe command line need --ignore-install. m4_gpu_driver (the retired G16 GPU driver) is still in the rescue kernel 7.1.13-m4 with the T6040 GPU alias.
blacklist m4_gpu_driver
blacklist apple_soc_cpufreq

# The AOP (light sensor, microphones) is a normal driver stack since m4.10: the kernel enables its nodes at boot and aop, aop_als,
# snd_soc_aop and apple_admac autoload by alias. A rescue boot (m4.safe on the command line) never loads them. Kill switch for normal
# boots: `blacklist aop` in a file under /etc/modprobe.d, then reboot.
install aop /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install aop'
install aop_als /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install aop_als'
install aop_las /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install aop_las'
install snd_soc_aop /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install snd_soc_aop'
install apple_admac /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install apple_admac'

# The video decoder (apple_avd) is a normal driver since m4.17 and autoloads by alias at boot. A rescue boot (m4.safe on the command
# line) never loads it. Kill switch for normal boots: `blacklist apple_avd` in a file under /etc/modprobe.d, then reboot.
install apple_avd /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install apple_avd'

# The right-hand USB-C port (USB2 host with hotplug) is a normal driver stack since the kernel that enables its device-tree nodes at boot: the
# USB2 PHY, the dwc3 (its role switch) and the PD controller autoload by alias, and the PD controller starts and stops the host on every plug
# and unplug. A rescue boot (m4.safe on the command line) never loads them. Kill switch for normal boots: `blacklist dwc3_apple` in a file
# under /etc/modprobe.d, then reboot (the PD controller then waits for the role switch and is never woken).
install phy_apple_t6040_usb2 /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install phy_apple_t6040_usb2'
install dwc3_apple /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install dwc3_apple'
install sn201202x /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install sn201202x'

# Memory performance (CLPC lane): SLC allocation (apple_mcc) and DCS/fabric votes from CPU load (clpc) are normal drivers since the kernel
# with clpc's sustain count (CLPC patch 0007), and autoload by alias at boot; apple_mcc waits for the display to bind. rmmod restores (SLC
# allocation off and flushed; floor back to 0). A rescue boot (m4.safe on the command line) never loads them. Kill switch for normal boots:
# `blacklist apple_mcc` and/or `blacklist clpc` in a file under /etc/modprobe.d, then reboot.
install apple_mcc /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install apple_mcc'
install clpc /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install clpc'

# Internal speakers (gaps G7): a normal driver stack since 7.1.12-m4.11 (stages 1-5 passed attended, 2026-10-16..20). The I2C
# controller, the six amps (tas2764, one fail-closed SDZ group) and the J616 card (macaudio on the AOP speaker stream) autoload by
# alias. The kernel keeps the volumes locked at about -100 dB until speakersafetyd (started by 95-m4-speakersafetyd.rules) holds
# the lock; unlocked, the volume goes up to 0 dB from linux-m4 7.1.12-19 (-10 dB before; `options snd_soc_macaudio
# speaker_ceiling_db=-10` keeps the old cap). A rescue boot (m4.safe on the command line) never loads
# them. Kill switch for normal boots: `blacklist snd_soc_macaudio` in a file under /etc/modprobe.d, then reboot (no card: the amps
# stay in hardware shutdown). The rollbacks m4.7/m4.9/m4.10 register no speaker stream by default, so their card never binds.
install i2c_pasemi_platform /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install i2c_pasemi_platform'
install snd_soc_tas2764 /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install snd_soc_tas2764'
install snd_soc_macaudio /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install snd_soc_macaudio'

# The PMP (power management coprocessor, CLPC lane): the driver starts the firmware when it binds, and autoloads by alias
# at boot since the attended tests passed (2026-10-19: started in 2-3 s; its fast die-temperature limit held all 14 busy
# CPUs at TCMz 111 C with the caps lifted). It never stops once started (macOS never stops it either), so unloading needs
# a reboot. A rescue boot (m4.safe on the command line) never loads it. Kill switch for normal boots: `blacklist pmp` in a
# file under /etc/modprobe.d, then reboot. Without a running PMP the kernel holds each CPU cluster at its fastest state that
# draws at most a third of the top state's power (apple-soc-cpufreq.c), whatever /etc/m4/cpufreq.conf says.
install pmp /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install pmp'

# The SoC watchdog (apple_wdt, DT node since linux-m4 7.1.12-13) binds at boot; it arms nothing at probe. Only systemd's default
# RebootWatchdogSec=10min uses it, during reboot and shutdown. Kill switch: `blacklist apple_wdt` under /etc/modprobe.d.

# Drivers the kernel brings up by itself since 7.1.12-m4.10; they autoload by alias, and a rescue boot never loads them:
# - asahi (GPU): the GPU node is enabled. Kill switch for normal boots: `blacklist asahi` in a file under /etc/modprobe.d, then reboot
#   (m4-gpu.service then leaves the software greeter). On the rollbacks m4.7/m4.9 m4-gpu.service loads it with t6040_attach=1 (through this rule).
# - appledrm (display): takes the panel over from simpledrm by default (takeover=1).
# - macsmc_input (power button, lid) and macsmc_hwmon (SMC sensors, TCMz for m4-cpufreq.service): SMC children like any other.
# - hci_bcm4377 (BCM4388 Bluetooth): its probe waits until the Wi-Fi function is bound to brcmfmac. Never unloaded (DMA isolation is incomplete).
install asahi /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install asahi'
install appledrm /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install appledrm'
install macsmc_input /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install macsmc_input'
install macsmc_hwmon /bin/sh -c 'grep -qsw m4.safe /proc/cmdline || exec /usr/bin/modprobe --ignore-install macsmc_hwmon'
# the rollbacks 7.1.12-m4.7/m4.9 lack the kernel's wait for the Wi-Fi bind: wait for it here (at most 30 s), then load anyway
install hci_bcm4377 /bin/sh -c 'grep -qsw m4.safe /proc/cmdline && exit 0; i=0; while [ $i -lt 300 ]; do set -- /sys/bus/pci/drivers/brcmfmac/0*:*; [ -e "$1" ] && break; sleep 0.1; i=$((i + 1)); done; exec /usr/bin/modprobe --ignore-install hci_bcm4377'

# Set by 7.1.12-m4.10 itself (appledrm takeover default, the J616s no-APST quirk, no deferred flush on this controller). Kept for the
# kernels that still need them: the rollbacks 7.1.12-m4.7/m4.9 (appledrm defaults to takeover=0, m4.7's NVMe driver defers flushes) and
# the rescue kernel 7.1.13-m4. Drop with those entries.
options appledrm takeover=1
options nvme_core default_ps_max_latency_us=0
options nvme_apple flush_interval=0

# The watchdog core keeps its default for a watchdog the firmware left running at boot (the core pings it until userspace takes over).
options watchdog handle_boot_enabled=1
