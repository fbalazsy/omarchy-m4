# The greeter user is uid 960: the only greeter uid the retired G16 GPU driver accepted; kept so the uid of existing installs never changes.
# This file sorts before sddm's own sddm.conf, so a fresh install gets 960 from here; an existing sddm keeps its uid.
u sddm 960 "SDDM Greeter Account" /var/lib/sddm -
# It needs the render and video nodes.
m sddm render
m sddm video
