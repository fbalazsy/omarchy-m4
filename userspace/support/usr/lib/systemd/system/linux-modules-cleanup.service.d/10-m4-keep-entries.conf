# m4-support (N3): kernel-modules-hook's linux-modules-cleanup.service removed every unowned module tree that is not the running kernel's,
# including the trees the boot entries and the rescue kernel need. Same logic, with those kvers skipped (see /usr/lib/m4/modules-cleanup).
[Service]
ExecStart=
ExecStart=/usr/lib/m4/modules-cleanup %v
