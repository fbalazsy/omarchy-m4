# P2 boot time (2026-10-15): systemd rate-limits /proc/self/mountinfo events to 5 per second and, while
# limited, holds every mount start job until the second is over (src/core/mount.c, mount_on_ratelimit_expire).
# Early boot here makes more than 5 mount-table changes (/tmp, the root remount, fusectl, /run/credentials/*),
# so local-fs.target came exactly 1.01 s after tmp.mount started on every boot, and sysinit, basic and the
# greeter waited with it. PID 1 reads this override in mount_enumerate(), after ManagerEnvironment= is applied.
[Manager]
ManagerEnvironment=SYSTEMD_DEFAULT_MOUNT_RATE_LIMIT_BURST=100
