# Compressed swap in RAM (STATUS G-29). Nothing configured a device before: Omarchy's 90-omarchy.conf only sits in
# /usr/share/omarchy/default. This sorts after it, so its zstd never wins: the linux-m4 kernel builds only the lz4 backend.
[zram0]
zram-size = min(ram / 4, 8192)
compression-algorithm = lz4
swap-priority = 100
fs-type = swap
