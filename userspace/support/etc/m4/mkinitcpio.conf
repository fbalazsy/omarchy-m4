# m4-boot builds the initramfs with this file (never /etc/mkinitcpio.conf and no preset: nothing may write /boot/initramfs-*).
# The root is NVMe on ext4. nvme_apple is the machine's controller; `nvme` (the PCI NVMe driver) is loaded too, so that QEMU's nvme-pci disk boots the
# identical image (natively it finds no PCI NVMe device and does nothing). apple-sart/rtkit/mailbox/pmgr/dart and ext4 are built in (test_initramfs_modules.py); no udev (its hwdb alone is 14 MB, the loader's window is 16 MiB):
# `base` resolves root=UUID= with blkid, `modconf` brings /usr/lib/modprobe.d/m4.conf (the nvme options), `m4-clock` sets the clock, `m4-boot-mark` writes /boot/m4/boot-pending as soon as the root is mounted, `shutdown`
# copies the initramfs to /run/initramfs so that systemd-shutdown pivots into it and unmounts the root completely (the stock Arch mechanism).
# MODULES is kept in sync with lane K's list (/usr/share/m4/initramfs-modules documents it).
MODULES=(nvme_core nvme nvme_apple)
BINARIES=()
FILES=()
HOOKS=(base modconf m4-clock m4-boot-mark shutdown)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
