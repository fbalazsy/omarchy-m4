# m4-bt-connect.service connects `device` after bluetoothd is up. With `controller` (this Mac's Bluetooth controller, which macOS
# shares) the two also name the link key macOS left for m4-bt-keyshare. Empty: neither runs.
# A file of your own wins on upgrade (pacman keeps it as bluetooth.conf.pacnew).
device=@M4_BT_HEADSET@
controller=@M4_BT_CONTROLLER@
