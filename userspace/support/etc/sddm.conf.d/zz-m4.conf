# m4-support: sddm reads /etc/sddm.conf.d/* in name order and the LAST file wins. Omarchy ships 10-wayland.conf (its own CompositorCommand) and
# 10-theme.conf: this file is named to sort after every file of the distribution and of the owner, so these keys are the ones in force.
# (A file named 10-m4.conf lost to 10-wayland.conf: the greeter was Omarchy's, on the system Mesa, and drew nothing.)
[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=/usr/lib/m4/sddm-compositor
SessionDir=/usr/share/m4/wayland-sessions

[X11]
SessionDir=/usr/share/m4/no-x11-sessions

[Users]
RememberLastSession=false
